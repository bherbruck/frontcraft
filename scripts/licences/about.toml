# cargo-about settings for THIRD_PARTY_LICENSES.html (scripts/third_party_licenses.sh).
# Only what ships: the platforms the game is released for, and no dev-dependencies.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
# Permissive licences only. A crate under anything else stops the build until someone looks at it.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]
