[package]
name = "prs_game"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
prs_mods.workspace = true
bevy.workspace = true
prs_runtime.workspace = true
prs_input.workspace = true
prs_view.workspace = true
prs_scene.workspace = true
prs_audio.workspace = true
prs_voice.workspace = true
prs_hud.workspace = true
prs_models.workspace = true
prs_atmosphere.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Document", "Location", "UrlSearchParams", "Window", "XmlHttpRequest"] }
# Compiles out info logs and below on the web, along with their strings and call sites.
log = { version = "0.4", features = ["release_max_level_warn"] }
tracing = { version = "0.1", default-features = false, features = ["release_max_level_warn"] }

# PRS_SHOT screenshots are native only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["png"] }
