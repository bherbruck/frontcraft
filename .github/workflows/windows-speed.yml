# Temporary: measures ways to make the Windows release build faster. Removed once the numbers are in.
name: Windows build speed

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_STRIP: symbols
  TARGET: x86_64-pc-windows-msvc
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -Ctarget-feature=+crt-static -Clink-arg=/SUBSYSTEM:WINDOWS -Clink-arg=/ENTRY:mainCRTStartup

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [base, lld, dist, dist-lld, dist-lld-sccache]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Settings
        run: |
          case "${{ matrix.variant }}" in *lld*) echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld" >>"$GITHUB_ENV" ;; esac
          case "${{ matrix.variant }}" in dist*) { echo "CARGO_PROFILE_RELEASE_LTO=false"; echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16"; } >>"$GITHUB_ENV" ;; esac
          case "${{ matrix.variant }}" in *sccache*) { echo "SCCACHE_GHA_ENABLED=true"; echo "RUSTC_WRAPPER=sccache"; } >>"$GITHUB_ENV" ;; esac
      - if: contains(matrix.variant, 'sccache')
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> bin"
          key: speed-${{ matrix.variant }}
          cache-on-failure: true
      - name: Build
        run: |
          start=$(date +%s)
          cargo build -p prs_game --release --locked --target "$TARGET"
          echo "### ${{ matrix.variant }}: build $(( $(date +%s) - start ))s, exe $(stat -c %s "bin/$TARGET/release/prs_game.exe") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: contains(matrix.variant, 'sccache')
        run: sccache --show-stats
