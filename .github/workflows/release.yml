# Builds the desktop game and publishes it as a GitHub Release, after SolidCraft's release pipeline.
#
#   Windows x86_64   .msi (WiX 5, per user, no admin)          scripts/stage_windows.sh
#   macOS aarch64    .app in a .dmg, signed ad hoc only         scripts/package_macos.sh
#   Linux x86_64     .tar.gz with launch scripts                scripts/package_linux.sh
#
# Tests run in ci.yml, not here, so a release takes as long as its slowest build.
# Every package carries LICENSE-MIT, LICENSE-APACHE and THIRD_PARTY_LICENSES.html (cargo-about).
# Each file is attached twice: FrontCraft-<version>-... and a name without the version (FrontCraft-windows.msi,
# FrontCraft-macos.dmg, FrontCraft-linux.tar.gz), so releases/latest/download/<name> links, which the page uses,
# keep working from one release to the next. latest.json lists them with their sizes.
#
# Release by pushing a tag v1.2.3 (that is also the installer version), or with Actions > Release > Run workflow
# on main, giving the tag (made on that commit if new). A tag run can read the caches main saved but saves its own
# where no other tag run sees them, so a nightly run on main builds without publishing to keep main's caches warm.
name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish the release under (made on this commit if it does not exist); empty builds without publishing
        required: false
      version:
        description: Installer version major.minor.build (default the tag's if it is v1.2.3, else the workspace's major.minor and today as yyddd)
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_STRIP: symbols
  # Thin LTO across crates cost about 7 of the Windows build's 9 warm minutes, for an exe no smaller. Without
  # it, and in 16 units, a warm build takes 2 to 3 minutes. Still opt-level 3. (rust-lld and sccache were
  # measured too and saved under 10 seconds.)
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_ABOUT_VERSION: 0.9.3

jobs:
  # One version for every platform, so the files and latest.json agree even across midnight, and the licence
  # notices once for all of them.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Resolve version
        env:
          REQUESTED: ${{ inputs.version }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          workspace=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          # A tag v1.2.3 is the version itself; any other tag takes the workspace's major.minor and today.
          if [[ -z "$REQUESTED" && "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then REQUESTED="${BASH_REMATCH[1]}"; fi
          version="${REQUESTED:-$(cut -d. -f1-2 <<<"$workspace").$(date -u +%y%j | sed 's/^0*//')}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || ((BASH_REMATCH[1] > 255 || BASH_REMATCH[2] > 255 || BASH_REMATCH[3] > 65535)); then
            echo "::error::version must be major.minor.build, major and minor under 256, build under 65536: $version"
            exit 1
          fi
          if [[ -n "$TAG" ]] && ! [[ "$TAG" =~ ^v[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::the tag must look like v1.2.3: $TAG"
            exit 1
          fi
          { echo "version=$version"; echo "tag=$TAG"; } >>"$GITHUB_OUTPUT"
          echo "### FrontCraft $version, release $TAG (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"
      - name: Third-party licences
        run: |
          curl -fsSL "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" --strip-components=1 "cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl/cargo-about"
          scripts/third_party_licenses.sh notices/THIRD_PARTY_LICENSES.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: notices
          if-no-files-found: error

  linux:
    name: Linux x86_64
    needs: prepare
    # The oldest GitHub-hosted image, so the binary only needs glibc >= 2.35.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      FRONTCRAFT_NOTICES: notices/THIRD_PARTY_LICENSES.html
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> bin"
          key: release-linux-x86_64
          cache-on-failure: true
      - name: Build
        run: cargo build -p prs_game --release --locked --config "build.rustflags = ['--remap-path-prefix=$PWD=']"
      - name: Package
        run: |
          scripts/package_linux.sh bin/release/prs_game "$VERSION" dist
          tar -tzf dist/*.tar.gz | grep -E 'FrontCraft/frontcraft$|THIRD_PARTY_LICENSES.html$|LICENSE-APACHE$'
          ldd bin/release/prs_game
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      FRONTCRAFT_NOTICES: notices/THIRD_PARTY_LICENSES.html
      TARGET: x86_64-pc-windows-msvc
      # Only for the game itself, since --target keeps these off build scripts: no console window, and the C
      # runtime linked in so it needs nothing that Windows does not already have.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -Ctarget-feature=+crt-static -Clink-arg=/SUBSYSTEM:WINDOWS -Clink-arg=/ENTRY:mainCRTStartup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> bin"
          key: release-windows-x86_64
          cache-on-failure: true
      - name: Build
        run: cargo build -p prs_game --release --locked --target "$TARGET"
      - name: Package
        run: |
          dotnet tool install --global wix --version 5.0.2
          export PATH="$PATH:$HOME/.dotnet/tools"
          scripts/stage_windows.sh stage "bin/$TARGET/release/prs_game.exe" "$VERSION"
          (cd stage && wix build -arch x64 -o FrontCraft.msi FrontCraft.wxs)
          mkdir -p dist
          cp stage/FrontCraft.msi "dist/FrontCraft-$VERSION.msi"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS aarch64
    needs: prepare
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      FRONTCRAFT_NOTICES: notices/THIRD_PARTY_LICENSES.html
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> bin"
          key: release-macos-aarch64
          cache-on-failure: true
      - name: Build
        run: cargo build -p prs_game --release --locked --config "build.rustflags = ['--remap-path-prefix=$PWD=']"
      - name: Package
        run: |
          scripts/package_macos.sh bin/release/prs_game "$VERSION" dist
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
          ls "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/dmg/FrontCraft.app/Contents/MacOS"
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/FrontCraft.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [prepare, linux, windows, macos]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: artifacts
      - name: Names without the version, latest.json and checksums
        working-directory: artifacts
        run: |
          cp "FrontCraft-$VERSION.msi" FrontCraft-windows.msi
          cp "FrontCraft-$VERSION-macos.dmg" FrontCraft-macos.dmg
          cp "FrontCraft-$VERSION-linux-x86_64.tar.gz" FrontCraft-linux.tar.gz
          entry() { jq -n --arg file "$1" --arg versioned "$2" --argjson bytes "$(stat -c %s "$1")" '{file: $file, versioned: $versioned, bytes: $bytes}'; }
          jq -n --arg version "$VERSION" --arg tag "$TAG" \
            --argjson w "$(entry FrontCraft-windows.msi "FrontCraft-$VERSION.msi")" \
            --argjson m "$(entry FrontCraft-macos.dmg "FrontCraft-$VERSION-macos.dmg")" \
            --argjson l "$(entry FrontCraft-linux.tar.gz "FrontCraft-$VERSION-linux-x86_64.tar.gz")" \
            '{version: $version, tag: $tag, file: $w.versioned, bytes: $w.bytes, platforms: {windows: $w, macos: $m, linux: $l}}' > latest.json
          sha256sum -- * | tee SHA256SUMS.txt
          cat latest.json
      - name: Publish
        working-directory: artifacts
        run: |
          notes="FrontCraft $VERSION for Windows (x86_64 .msi), macOS (Apple Silicon .dmg) and Linux (x86_64 .tar.gz).

          The macOS app is not notarised: the first time, right click FrontCraft and choose Open."
          # A tag with a suffix (v0.1.2-test) is a pre-release, and never becomes the latest the page offers.
          if [[ "$TAG" == *-* ]]; then flags=(--prerelease --latest=false); else flags=(--latest); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Replace the whole asset set, so nothing from an earlier build of this tag is left behind.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              [ -n "$asset" ] && gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release upload "$TAG" --clobber -- *
            gh release edit "$TAG" --title "FrontCraft $VERSION" --draft=false "${flags[@]}"
          elif gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            # A pushed tag: release it as it is. With --target as well, v0.1.26310 got a 403 from the API.
            gh release create "$TAG" --verify-tag --title "FrontCraft $VERSION" --notes "$notes" "${flags[@]}" -- *
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "FrontCraft $VERSION" --notes "$notes" "${flags[@]}" -- *
          fi
          echo "Published https://github.com/$GH_REPO/releases/tag/$TAG" >>"$GITHUB_STEP_SUMMARY"
